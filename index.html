<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>大海战 · H5 版</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 0%, #0e2440 0%, #081426 55%, #050b16 100%);
    color: #cfe3f5;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    touch-action: manipulation;
  }
  header {
    padding: 10px 16px 6px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    user-select: none;
  }
  header h1 { font-size: 1.25rem; color: #6ec6ff; letter-spacing: 2px; font-weight: 600; }
  header span { font-size: 0.72rem; color: #4b6a8a; }
  #stage {
    /* 原始舞台 640x420,按比例适配可视区域 */
    width: min(calc(100vw - 20px), calc((100dvh - 118px) * (640 / 420)));
    aspect-ratio: 640 / 420;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 10px 44px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(110, 198, 255, 0.14);
  }
  #stage:fullscreen { width: 100vw; height: 100dvh; border-radius: 0; }
  #stage:-webkit-full-screen { width: 100vw; height: 100dvh; border-radius: 0; }
  #player-holder, #player-holder ruffle-player {
    width: 100%; height: 100%; display: block;
  }
  #toolbar {
    padding: 12px 16px 4px;
    display: flex;
    gap: 10px;
    user-select: none;
  }
  #toolbar button {
    background: rgba(110, 198, 255, 0.08);
    color: #a9d3ef;
    border: 1px solid rgba(110, 198, 255, 0.22);
    padding: 7px 18px;
    border-radius: 7px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  #toolbar button:hover { background: rgba(110, 198, 255, 0.18); color: #fff; }
  #hint {
    padding: 4px 16px 10px;
    font-size: 0.72rem;
    color: #45658a;
    text-align: center;
    user-select: none;
  }
  #error-box {
    display: none;
    margin: 20px;
    padding: 14px 18px;
    max-width: 480px;
    background: rgba(255, 82, 82, 0.1);
    border: 1px solid rgba(255, 82, 82, 0.4);
    border-radius: 8px;
    color: #ff9e9e;
    font-size: 0.85rem;
    line-height: 1.6;
  }
</style>
</head>
<body>
<header>
  <h1>⚓ 大海战</h1>
  <span>原版 Flash · Ruffle 模拟</span>
</header>

<div id="stage">
  <div id="player-holder"></div>
  <div id="error-box"></div>
</div>

<div id="toolbar">
  <button id="btn-full" type="button">⛶ 全屏</button>
  <button id="btn-restart" type="button">↻ 重新开始</button>
</div>
<p id="hint">鼠标点击操作,手机上直接点按屏幕即可 · 若浏览器拦截了声音,点击一次画面即可开启</p>

<noscript>
  <p style="padding:16px;color:#ff9e9e">本页面需要启用 JavaScript 才能运行游戏。</p>
</noscript>

<script src="ruffle/ruffle.js"></script>
<script>
(function () {
  "use strict";
  var stage = document.getElementById("stage");
  var holder = document.getElementById("player-holder");
  var errorBox = document.getElementById("error-box");
  var player = null;

  function showError(msg) {
    errorBox.style.display = "block";
    errorBox.textContent = "游戏加载失败:" + msg;
  }

  function loadGame() {
    var ruffle = window.RufflePlayer.newest();
    player = ruffle.createPlayer();
    holder.appendChild(player);
    player.load({
      url: "dahaizhan.swf",
      base: "./",
      autoplay: "on",
      unmuteOverlay: "visible",
      splashScreen: true,
      scale: "showAll",
      letterbox: "off",
      contextMenu: "on",
      logLevel: "error"
    }).catch(function (err) {
      showError(err && err.message ? err.message : String(err));
    });
  }

  window.addEventListener("load", function () {
    try {
      loadGame();
    } catch (e) {
      showError(e && e.message ? e.message : String(e));
    }
  });

  // 重新开始:销毁播放器后重建
  document.getElementById("btn-restart").addEventListener("click", function () {
    if (player) { player.remove(); player = null; }
    errorBox.style.display = "none";
    try {
      loadGame();
    } catch (e) {
      showError(e && e.message ? e.message : String(e));
    }
  });

  // 全屏(iOS Safari 不支持 div 全屏时静默降级)
  document.getElementById("btn-full").addEventListener("click", function () {
    var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (fsEl) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      return;
    }
    var req = stage.requestFullscreen || stage.webkitRequestFullscreen;
    if (req) {
      var p = req.call(stage);
      if (p && p.catch) { p.catch(function () {}); }
    }
  });
})();
</script>
</body>
</html>
