<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>大海战 · 中文版</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 0%, #0e2440 0%, #081426 55%, #050b16 100%);
    color: #cfe3f5;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    touch-action: manipulation;
  }
  header {
    padding: 10px 16px 6px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    user-select: none;
  }
  header h1 { font-size: 1.25rem; color: #6ec6ff; letter-spacing: 2px; font-weight: 600; }
  header span { font-size: 0.72rem; color: #4b6a8a; }
  #stage {
    width: min(calc(100vw - 20px), calc((100dvh - 118px) * (640 / 420)));
    aspect-ratio: 640 / 420;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 10px 44px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(110, 198, 255, 0.14);
  }
  #stage:fullscreen { width: 100vw; height: 100dvh; border-radius: 0; }
  #stage:-webkit-full-screen { width: 100vw; height: 100dvh; border-radius: 0; }
  #player-holder, #player-holder ruffle-player { width: 100%; height: 100%; display: block; }
  #toolbar {
    padding: 12px 16px 4px;
    display: flex;
    gap: 10px;
    user-select: none;
  }
  #toolbar button {
    background: rgba(110, 198, 255, 0.08);
    color: #a9d3ef;
    border: 1px solid rgba(110, 198, 255, 0.22);
    padding: 7px 18px;
    border-radius: 7px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  #toolbar button:hover { background: rgba(110, 198, 255, 0.18); color: #fff; }
  #hint {
    padding: 4px 16px 10px;
    font-size: 0.72rem;
    color: #45658a;
    text-align: center;
    user-select: none;
  }
  #error-box {
    display: none;
    margin: 20px;
    padding: 14px 18px;
    max-width: 480px;
    background: rgba(255, 82, 82, 0.1);
    border: 1px solid rgba(255, 82, 82, 0.4);
    border-radius: 8px;
    color: #ff9e9e;
    font-size: 0.85rem;
    line-height: 1.6;
  }
  /* 手机虚拟方向键(布阵阶段旋转军舰用) */
  #dpad {
    display: none;
    position: fixed;
    right: 14px;
    bottom: 14px;
    width: 132px;
    height: 132px;
    z-index: 90;
  }
  #dpad button {
    position: absolute;
    width: 44px; height: 44px;
    border-radius: 10px;
    border: 1px solid rgba(110, 198, 255, 0.35);
    background: rgba(10, 30, 55, 0.72);
    color: #bfe3ff;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
  }
  #dpad button:active { background: rgba(110, 198, 255, 0.35); }
  #dpad .left  { left: 0;  top: 44px; }
  #dpad .right { right: 0; top: 44px; }
  #dpad .down  { left: 44px; bottom: 0; }
  #dpad .off   { left: 44px; top: 44px; border-radius: 22px; font-size: 12px; }
  @media (pointer: coarse) {
    #dpad { display: block; }
  }
</style>
</head>
<body>
<header>
  <h1>⚓ 大海战</h1>
  <span>中文版 · 原版复刻</span>
</header>

<div id="stage">
  <div id="player-holder"></div>
  <div id="error-box"></div>
</div>

<div id="toolbar">
  <button id="btn-full" type="button">⛶ 全屏</button>
  <button id="btn-restart" type="button">↻ 重新开始</button>
  <button id="btn-dpad" type="button" style="display:none">⌨ 方向键</button>
</div>
<p id="hint">先在左栏选军舰,用左右键转向,再点海面布阵 · 点右侧敌军海域开炮</p>

<div id="dpad">
  <button class="left" type="button" aria-label="向左旋转">◀</button>
  <button class="right" type="button" aria-label="向右旋转">▶</button>
  <button class="down" type="button" aria-label="下">▼</button>
  <button class="off" type="button" aria-label="隐藏方向键">隐藏</button>
</div>

<noscript>
  <p style="padding:16px;color:#ff9e9e">本页面需要启用 JavaScript 才能运行游戏。</p>
</noscript>

<script src="ruffle/ruffle.js"></script>
<script>
(function () {
  "use strict";
  var stage = document.getElementById("stage");
  var holder = document.getElementById("player-holder");
  var errorBox = document.getElementById("error-box");
  var dpad = document.getElementById("dpad");
  var btnDpad = document.getElementById("btn-dpad");
  var player = null;

  // canvas 渲染器:让游戏内动态文字(将军播报/船名/输入框)使用系统字体显示中文
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    deviceFontRenderer: "canvas",
    letterbox: "off"
  };

  function showError(msg) {
    errorBox.style.display = "block";
    errorBox.textContent = "游戏加载失败:" + msg;
  }

  function loadGame() {
    var ruffle = window.RufflePlayer.newest();
    player = ruffle.createPlayer();
    holder.appendChild(player);
    player.load({
      url: "dahaizhan_cn.swf",
      base: "./",
      autoplay: "on",
      unmuteOverlay: "visible",
      splashScreen: true,
      scale: "showAll",
      letterbox: "off",
      contextMenu: "on",
      logLevel: "error"
    }).catch(function (err) {
      showError(err && err.message ? err.message : String(err));
    });
  }

  window.addEventListener("load", function () {
    try {
      loadGame();
    } catch (e) {
      showError(e && e.message ? e.message : String(e));
    }
  });

  document.getElementById("btn-restart").addEventListener("click", function () {
    if (player) { player.remove(); player = null; }
    errorBox.style.display = "none";
    try {
      loadGame();
    } catch (e) {
      showError(e && e.message ? e.message : String(e));
    }
  });

  // 全屏
  document.getElementById("btn-full").addEventListener("click", function () {
    var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (fsEl) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      return;
    }
    var req = stage.requestFullscreen || stage.webkitRequestFullscreen;
    if (req) {
      var p = req.call(stage);
      if (p && p.catch) { p.catch(function () {}); }
    }
  });

  /* 手机虚拟方向键:向播放器派发方向键事件(布阵阶段旋转军舰) */
  function sendKey(code) {
    var ev = new KeyboardEvent("keydown", {
      key: code === 37 ? "ArrowLeft" : "ArrowRight",
      code: code === 37 ? "ArrowLeft" : "ArrowRight",
      keyCode: code,
      which: code,
      bubbles: true,
      cancelable: true
    });
    var el = player || stage;
    el.dispatchEvent(ev);
    var up = new KeyboardEvent("keyup", {
      key: code === 37 ? "ArrowLeft" : "ArrowRight",
      code: code === 37 ? "ArrowLeft" : "ArrowRight",
      keyCode: code,
      which: code,
      bubbles: true,
      cancelable: true
    });
    el.dispatchEvent(up);
  }

  dpad.querySelector(".left").addEventListener("click", function () { sendKey(37); });
  dpad.querySelector(".right").addEventListener("click", function () { sendKey(39); });
  dpad.querySelector(".down").addEventListener("click", function () { sendKey(40); });

  function toggleDpad(force) {
    var show = force !== undefined ? force : dpad.style.display !== "block";
    dpad.style.display = show ? "block" : "none";
    btnDpad.textContent = show ? "⌨ 隐藏方向键" : "⌨ 方向键";
  }

  // 触屏设备默认显示;桌面隐藏(用物理键盘)
  if (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) {
    dpad.style.display = "block";
    btnDpad.style.display = "inline-block";
    btnDpad.textContent = "⌨ 隐藏方向键";
  } else {
    btnDpad.style.display = "inline-block";
    btnDpad.textContent = "⌨ 方向键";
    btnDpad.addEventListener("click", function () { toggleDpad(); });
  }

  dpad.querySelector(".off").addEventListener("click", function () { toggleDpad(false); });
})();
</script>
</body>
</html>
